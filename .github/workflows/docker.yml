name: Docker image

# Publishes the production image to GitHub Container Registry; the server only pulls it instead of compiling
# everything itself. Every push to main builds linux/amd64, which is what AWS Lightsail runs. It can also be
# started by hand from the Actions tab.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A new push cancels a build that is still running instead of queueing behind it.
concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    # A stuck build fails here instead of burning hours of Actions minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name in lowercase
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Always fetch the base image again so a stale cached layer can never keep an old PHP version.
          pull: true
          platforms: linux/amd64
          push: true
          # No provenance or SBOM attestations: they add extra "unknown/unknown" manifests to the package and
          # build time, and this demo does not use them.
          provenance: false
          sbom: false
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          # `min` caches only the final layers; `max` would also export every intermediate stage and fill the
          # 10 GB cache quota of Actions.
          cache-to: type=gha,mode=min
