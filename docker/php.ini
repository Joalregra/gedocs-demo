; Production settings for the demo image.
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M

; Uploads: the app accepts documents up to 10 MB (see FolderController::upload).
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 60

; Opcache: code never changes inside a running container.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 96
opcache.max_accelerated_files = 20000

date.timezone = America/Bogota
