# Variant: run behind a shared reverse proxy on the same instance. See "Behind the shared proxy" in
# docs/deploy-aws-lightsail.md.
#
# The proxy owns ports 80 and 443 and the TLS certificates. This container serves plain HTTP on the
# shared Docker network "web" and publishes no port, so only the proxy can reach it.
#
# In the server .env (never committed), set:
#
#   APP_DOMAIN=:80
#   COMPOSE_FILE=docker-compose.yml:docker-compose.proxy.yml
#
# APP_DOMAIN=:80 makes the Caddy inside the container listen on port 80 only and request no
# certificate. With COMPOSE_FILE set, the usual commands (docker compose pull, docker compose up -d)
# use both files without -f. The !reset tag needs Docker Compose 2.24 or later.
services:
  app:
    ports: !reset []
    networks:
      default: {}
      web:
        aliases:
          - gedocs-app

networks:
  web:
    external: true
