name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP tests (Pest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: gd, zip, intl, bcmath, pdo_sqlite, exif, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # The Inertia pages need the Vite manifest, so the frontend is built first.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - name: Run tests
        run: php artisan test

      - name: Known vulnerabilities in PHP dependencies
        run: composer audit

  frontend:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # laravel-vite-plugin refuses to start when CI=true because it expects a production build.
      # Vitest only needs its `@` alias, so the check is bypassed for the tests.
      - run: npm run test:unit
        env:
          LARAVEL_BYPASS_ENV_CHECK: "1"
      - name: Known vulnerabilities in npm dependencies
        run: npm audit

  traces:
    name: No institutional traces
    runs-on: ubuntu-24.04
    steps:
      # Full history: gitleaks scans every commit of the repository, not only the last snapshot.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The identifying terms (real names, domains) are kept in a repository secret so they are
      # never written in the code. Format: pipe-separated, e.g. "Name One|other-domain.com".
      - name: Scan for traces
        env:
          EXTRA_TERMS: ${{ secrets.TRACE_EXTRA_TERMS }}
          # The README credits the team by name on purpose (see docs/demo-decisions.md).
          EXCLUDE_FILES: README.md
        run: bash buscar-rastros.sh .

      # The official binary (pinned version and checksum) scans the whole history. The packaged action
      # scans only the commit range of the push, which breaks on the first push, on force pushes and on
      # new branches because the range start does not exist in the clone.
      - name: Scan for secrets (full history)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          "$RUNNER_TEMP/gitleaks" git "$GITHUB_WORKSPACE" --redact --no-banner -v
