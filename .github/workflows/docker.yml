name: Docker image

# Publishes the production image to GitHub Container Registry; the server only pulls it instead of compiling
# everything itself. Every push to main builds linux/amd64, which is what AWS Lightsail runs. arm64 (the Oracle
# Ampere alternative) is built only on demand: start this workflow by hand and choose both platforms. The
# arm64 build compiles the PHP extensions under QEMU emulation, which is slow, so it is never run on push.
# The next push to main replaces `latest` with the amd64-only image again.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build"
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64
        default: linux/amd64

permissions:
  contents: read
  packages: write

# A new push cancels a build that is still running instead of queueing behind it.
concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    # A stuck build fails here instead of burning hours of Actions minutes (the arm64 build gets more time).
    timeout-minutes: ${{ contains(inputs.platforms, 'arm64') && 120 || 30 }}
    env:
      PLATFORMS: ${{ inputs.platforms || 'linux/amd64' }}
    steps:
      - uses: actions/checkout@v4

      # QEMU is only needed to build a foreign architecture.
      - uses: docker/setup-qemu-action@v3
        if: contains(env.PLATFORMS, 'arm64')
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name in lowercase
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Always fetch the base image again so a stale cached layer can never keep an old PHP version.
          pull: true
          platforms: ${{ env.PLATFORMS }}
          push: true
          # No provenance or SBOM attestations: they add extra "unknown/unknown" manifests to the package and
          # build time, and this demo does not use them.
          provenance: false
          sbom: false
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          # `min` caches only the final layers; `max` would also export every intermediate stage and fill the
          # 10 GB cache quota of Actions.
          cache-to: type=gha,mode=min
